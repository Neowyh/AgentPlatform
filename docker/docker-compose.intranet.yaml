services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    pull_policy: never
    container_name: ideer-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      - ideer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:2026/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    image: ${IDEER_FRONTEND_IMAGE:-ideer-frontend:latest}
    pull_policy: never
    container_name: ideer-frontend
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - IDEER_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ${IDEER_FRONTEND_ENV_FILE:?IDEER_FRONTEND_ENV_FILE must be set}
    networks:
      - ideer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

  gateway:
    image: ${IDEER_GATEWAY_IMAGE:-ideer-gateway:latest}
    pull_policy: never
    container_name: ideer-gateway
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        APT_MIRROR: ${APT_MIRROR:-}
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        NODESOURCE_URL: ${NODESOURCE_URL:-}
    # Runs and stream buffers are process-local while stream_bridge.type=memory.
    # Keep offline Docker single-worker by default so stream reconnect/join
    # requests hit the same worker that owns the active run.
    command: sh -c "cd backend && PYTHONPATH=. uv run --no-sync uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-1}"
    volumes:
      - ${IDEER_CONFIG_PATH}:/app/backend/config.yaml:ro
      - ${IDEER_EXTENSIONS_CONFIG_PATH}:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ${IDEER_HOME}:/app/backend/.ideer
      - ${IDEER_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    working_dir: /app
    environment:
      - CI=true
      - IDEER_PROJECT_ROOT=/app
      - IDEER_HOME=/app/backend/.ideer
      - IDEER_CONFIG_PATH=/app/backend/config.yaml
      - IDEER_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - IDEER_CHANNELS_LANGGRAPH_URL=${IDEER_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - IDEER_CHANNELS_GATEWAY_URL=${IDEER_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - IDEER_INTERNAL_AUTH_TOKEN=${IDEER_INTERNAL_AUTH_TOKEN}
      - IDEER_HOST_BASE_DIR=${IDEER_HOME}
      - IDEER_HOST_SKILLS_PATH=${IDEER_REPO_ROOT}/skills
      - IDEER_SANDBOX_HOST=host.docker.internal
    env_file:
      - ${IDEER_ENV_FILE:?IDEER_ENV_FILE must be set}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ideer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  ideer:
    driver: bridge
