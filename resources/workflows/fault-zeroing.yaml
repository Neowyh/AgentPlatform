schema_version: 2
name: fault-zeroing
description: 归零排故工作流 — 基于证据资料完成故障树构建、底事件评估、根因归因、纠正措施和归零报告生成

inputs:
  upload_dir:
    type: string
    required: true
    description: "用户上传资料的目录路径（沙箱虚拟路径，如 /mnt/user-data/uploads/<case>/）"
  problem_description:
    type: string
    default: ""
    description: "问题/顶事件描述"
  output_base_dir:
    type: string
    default: "/mnt/user-data/outputs"
    description: "产物输出基础目录（沙箱虚拟路径；运行结束后可在运行详情页浏览和下载产物）"

state:
  evidence_summary:
    type: object
    default: {}
  tree_structure:
    type: object
    default: {}
  all_findings:
    type: object
    default: {}
  assessment_summary:
    type: object
    default: {}
  assessment_review:
    type: object
    default: {}
  corrective_actions_summary:
    type: object
    default: {}

entrypoint: fork_start

nodes:
  # ── fork: 证据提取 与 演绎建树 并行 ──
  - id: fork_start
    type: fork
    branches:
      - evidence_collection
      - deductive_tree
    join: join_review

  - id: evidence_collection
    type: action
    action:
      kind: agent
      name: fault-zeroing
      file_access:
        read:
          - "{{inputs.upload_dir}}"
          - "/mnt/skills/fault-zeroing"
          - "/mnt/skills/fault-zeroing/references"
        write:
          - "{{inputs.output_base_dir}}/artifacts/evidence/evidence_table.json"
          - "{{inputs.output_base_dir}}/artifacts/evidence/coverage_matrix.md"
      params:
        max_turns: 150
        system_prompt: |
          你是证据分析师。只负责读取资料、抽取证据、标注来源，不做根因结论。
        prompt: |
          任务：读取归零资料，提取证据，形成证据台账。

          执行前先读取证据规则：
          /mnt/skills/fault-zeroing/references/evidence_rules.md

          上传目录：{{inputs.upload_dir}}
          问题描述：{{inputs.problem_description}}

          你拥有对该目录的完整读取权限，可以直接对精确路径 {{inputs.upload_dir}}
          使用 ls / glob / grep 枚举目录内容（注意：不要枚举上级目录，上级目录不在权限内）。

          1. 使用 glob 扫描 {{inputs.upload_dir}}，了解文件结构
          2. 按格式读取关键文件：
             - .doc/.docx/.pdf/.xls/.xlsx/.ppt/.pptx 调用 read_document 转 Markdown 后读取
               （遇截断标记用 page_range 分段继续；转换结果为空疑似扫描件时按失败契约处理）
             - .md/.txt/.log 等纯文本直接用 read_file 读取
          3. 读取文件内容，抽取每一条证据
          4. 检查五类资料覆盖情况：问题描述、设计约束、试验记录或日志、总结报告、历史或复核记录
          5. 生成证据台账

          输出：
          a) 写入 {{inputs.output_base_dir}}/artifacts/evidence/evidence_table.json
            每条证据包含 id、source（文件路径#行号或章节）、grade（A/B/C/D）、
            type、summary、supports（可支撑的事件ID）、contradicts（反证对象ID）
          b) 写入 {{inputs.output_base_dir}}/artifacts/evidence/coverage_matrix.md
          c) 输出摘要：总证据数、A/B/C/D 各级分布、覆盖情况
          失败契约：若无法完成任务，回复必须以 FAILED: 开头说明原因；
          严禁写入占位文件或空文件。
    writes:
      - "$.state.evidence_summary"

  - id: deductive_tree
    type: action
    action:
      kind: agent
      name: fault-zeroing
      file_access:
        read:
          - "/mnt/skills/fault-zeroing"
          - "/mnt/skills/fault-zeroing/templates"
        write:
          - "{{inputs.output_base_dir}}/artifacts/tree/fault_tree_structure.json"
      params:
        max_turns: 150
        system_prompt: |
          你是系统安全分析师（演绎模式）。基于工程机理做纯演绎推导。
          不看任何证据台账。列出所有理论上可能的故障原因。
        prompt: |
          任务：基于工程机理，从顶事件出发构建完整的故障树。

          问题描述：{{inputs.problem_description}}

          工作目录：{{inputs.output_base_dir}}/artifacts/tree/（不需要关心其他目录）

          1. 确认顶事件（必须来自问题描述）
          2. 逐层推导中间事件（故障传播链、功能失效链、条件组合）
          3. 细化到底事件（可验证的最小单元）
          4. 标注逻辑关系（AND/OR）

          约束：
          - 不依赖任何来源文件或证据台账
          - 不做概率判断，不给状态标记
          - 列出所有理论上可能的路径

          输出：写入 {{inputs.output_base_dir}}/artifacts/tree/fault_tree_structure.json
          参考 /mnt/skills/fault-zeroing/templates/fault_tree.schema.json 格式，
          但不填充 evidence_ids、probability、
          probability_basis、confidence、status 字段（留 null 或空数组）
          失败契约：若无法完成任务，回复必须以 FAILED: 开头说明原因；
          严禁写入占位文件或空文件。
    writes:
      - "$.state.tree_structure"

  # ── join: 等待两路完成 ──
  - id: join_review
    type: join
    fork: fork_start

  # ── 审查与检漏 ──
  - id: review_and_crosscheck
    type: action
    action:
      kind: agent
      name: fault-zeroing
      file_access:
        read:
          - "/mnt/skills/fault-zeroing"
          - "{{inputs.output_base_dir}}/artifacts/tree/fault_tree_structure.json"
          - "{{inputs.output_base_dir}}/artifacts/evidence/evidence_table.json"
        write: []
      params:
        max_turns: 150
        system_prompt: |
          你是故障树审查与证据检漏分析师。做两遍独立扫描：
          第一遍从机理检查结构完整性；第二遍从证据反向检查遗漏。
        prompt: |
          任务：审查故障树 + 证据交叉检漏。

          读取：
          a) {{inputs.output_base_dir}}/artifacts/tree/fault_tree_structure.json
          b) {{inputs.output_base_dir}}/artifacts/evidence/evidence_table.json

          第一遍（机理审查）：
          忽略证据表，仅检查：
          - 是否遗漏了理论上可能的故障分支？
          - 逻辑门是否正确反映故障传播关系？
          - 底事件是否可验证（避免笼统描述）？

          第二遍（证据交叉检漏）：
          逐条对照证据台账：如果某条证据指向的故障模式在树中无对应路径，
          记录为"遗漏"。只做添加不做删除。

          输出（仅写入 state，不写文件；引擎会自动把本回复保存为文件供下游节点读取）：
          ```json
          {
            "structure_issues": [
              {"node_id": "...", "issue": "...", "severity": "error|warning", "suggested_fix": "..."}
            ],
            "evidence_gaps": [
              {"evidence_id": "...", "evidence_summary": "...",
               "suggested_path": ["顶事件", "...", "..."],
               "suggested_event": "建议新增节点描述",
               "reason": "遗漏原因"}
            ]
          }
          ```

          失败契约：若无法完成任务，回复必须以 FAILED: 开头说明原因；
          严禁编造审查结论。
    writes:
      - "$.state.all_findings"

  # ── 整合裁决 ──
  - id: integrate_tree
    type: action
    action:
      kind: agent
      name: fault-zeroing
      file_access:
        read:
          - "/mnt/skills/fault-zeroing"
          - "{{inputs.output_base_dir}}/artifacts/tree/"
          - "{{inputs.output_base_dir}}/artifacts/evidence/"
        write:
          - "{{inputs.output_base_dir}}/artifacts/tree/fault_tree_structure.json"
      params:
        max_turns: 150
        system_prompt: |
          你是故障树整合分析师。使用四象限裁决矩阵规则对发现问题做最终决策。
        prompt: |
          读取：
          a) {{inputs.output_base_dir}}/artifacts/tree/fault_tree_structure.json
          b) 审查发现：读取 {{state_files.all_findings}}
             （文件不存在说明上游节点失败，此时必须以 FAILED: 开头回复，不得编造）

          裁决规则（四象限矩阵）：

          |                    | 有证据支持 | 无证据支持 |
          |--------------------|-----------|-----------|
          | 树中有该节点       | 保留       | 保留       |
          | 树中无该节点       | 需要添加   | 忽略       |

          关键原则：
          - 证据永远不会缩小树结构
          - 检漏发现的遗漏，分层裁决：
            第1层：机理评估——该路径在理论上是否可能？
            第2层：证据可信度——证据场景与故障是否匹配？
            第3层：决定添加（to_verify）或不添加（记录遗留风险）

          可选：如需核验证据内容，可读取 c) {{inputs.output_base_dir}}/artifacts/evidence/evidence_table.json

          输出：覆盖写入 {{inputs.output_base_dir}}/artifacts/tree/fault_tree_structure.json
          失败契约：若无法完成任务，回复必须以 FAILED: 开头说明原因；
          严禁写入占位文件或空文件。
    writes:
      - "$.state.tree_structure"

  # ── 证据评估 ──
  - id: evidence_assessment
    type: action
    action:
      kind: agent
      name: fault-zeroing
      file_access:
        read:
          - "/mnt/skills/fault-zeroing"
          - "{{inputs.output_base_dir}}/artifacts/tree/fault_tree_structure.json"
          - "{{inputs.output_base_dir}}/artifacts/evidence/evidence_table.json"
          - "{{inputs.output_base_dir}}/artifacts/evidence/coverage_matrix.md"
        write:
          - "{{inputs.output_base_dir}}/fault_tree.json"
      params:
        max_turns: 150
        system_prompt: |
          你是证据评估分析师。对照证据逐底事件评估，同时完成根因归因和验证计划。
        prompt: |
          任务：对照证据评估每个底事件，确定根因，生成验证计划。

          执行前先读取输出格式 schema：
          /mnt/skills/fault-zeroing/templates/fault_tree.schema.json
          写入前必须按该 schema 逐字段自检，确保字段齐全、枚举合法。

          读取：
          a) {{inputs.output_base_dir}}/artifacts/tree/fault_tree_structure.json
          b) {{inputs.output_base_dir}}/artifacts/evidence/evidence_table.json
          c) {{inputs.output_base_dir}}/artifacts/evidence/coverage_matrix.md

          1. 为每个底事件匹配证据（evidence_ids）
          2. 评估证据强度、概率判断、置信度、状态
          3. 综合确定根因
          4. 为待验证项生成验证计划

          规则：
          - 保留所有节点，不做删除
          - 无直接证据 → status: to_verify, probability: null
          - 有反证证据 → 保留节点，降低概率
          - 根因必须有 A/B 级证据；否则标 to_verify
          - 数值概率须有明确依据；否则 null

          verification_plan 每项必须包含且只能引用 schema 要求的字段：
           - id（如 VP-001）、target_id（引用其指向的底事件或根因 id）、
             item、method、expected_result、status
           - status 只能是 pending / in_progress / passed / failed / blocked
             （新验证项一律用 pending；禁止用 to_verify）
          注意 status 枚举分两类，不要混用：
           - bottom_events / root_causes 的 status 用
             confirmed / rejected / to_verify / not_applicable
           - verification_plan 的 status 用
             pending / in_progress / passed / failed / blocked

          输出：写入 {{inputs.output_base_dir}}/fault_tree.json
          包含 7 个顶级字段：top_event, intermediate_events, bottom_events,
          logic, evidence, root_causes, verification_plan
          失败契约：若无法完成任务，回复必须以 FAILED: 开头说明原因；
          严禁写入占位文件或空文件。
    schemas:
      - file: "{{inputs.output_base_dir}}/fault_tree.json"
        schema_file: "/mnt/skills/fault-zeroing/templates/fault_tree.schema.json"
    writes:
      - "$.state.assessment_summary"
    retry:
      max_attempts: 2
      backoff_seconds: 30

  # ── 评估审核 ──
  - id: assessment_review
    type: action
    action:
      kind: agent
      name: fault-zeroing
      file_access:
        read:
          - "/mnt/skills/fault-zeroing"
          - "{{inputs.upload_dir}}"
          - "{{inputs.output_base_dir}}/artifacts/tree/"
          - "{{inputs.output_base_dir}}/artifacts/evidence/"
          - "{{inputs.output_base_dir}}/fault_tree.json"
        write: []
      params:
        max_turns: 150
        system_prompt: |
          你是证据审核专家。标准比评估分析师更严格。只输出问题清单，不做修正。
        prompt: |
          审查 {{inputs.output_base_dir}}/fault_tree.json：

          检查项：
          - 底事件 evidence_ids 是否正确引用
          - confirmed 底事件是否有 A/B 级证据
          - 概率判断是否有明确依据
          - 根因应确认还是应标 to_verify
          - 验证计划可行性

          如需回查上传资料原文核对证据来源：
          - .doc/.docx/.pdf/.xls/.xlsx/.ppt/.pptx 用 read_document 转 Markdown 后读取
            （遇截断标记用 page_range 分段继续）
          - .md/.txt/.log 等纯文本直接用 read_file 读取

          输出：
          ```json
          {
            "issues": [
              {"node_id": "BE-003", "issue": "confirmed 但只有 C 级证据",
               "suggested_fix": "改为 to_verify"},
              {"node_id": "RC-001", "issue": "根因无 A/B 级证据",
               "suggested_fix": "标 to_verify"}
            ]
          }
          ```

          失败契约：若无法完成任务，回复必须以 FAILED: 开头说明原因；
          严禁输出推测性结论。
    writes:
      - "$.state.assessment_review"

  # ── 评估优化 ──
  - id: assessment_refine
    type: action
    action:
      kind: agent
      name: fault-zeroing
      file_access:
        read:
          - "/mnt/skills/fault-zeroing"
          - "{{inputs.output_base_dir}}/fault_tree.json"
        write:
          - "{{inputs.output_base_dir}}/fault_tree.json"
      params:
        max_turns: 150
        system_prompt: |
          你是评估分析师（优化模式）。逐条回应审查意见：同意则修正，不同意则说明理由。
        prompt: |
          读取 {{inputs.output_base_dir}}/fault_tree.json

          审查发现的问题：读取 {{state_files.assessment_review}}
          （文件不存在说明审核节点失败，此时必须以 FAILED: 开头回复，不得编造）

          对每条问题，逐一回应：
          - 同意 → 修正 fault_tree.json
          - 不同意 → 说明理由

          输出：覆盖写入 {{inputs.output_base_dir}}/fault_tree.json
    writes:
      - "$.state.assessment_summary"

  # ── 纠正措施 ──
  - id: corrective_actions
    type: action
    action:
      kind: agent
      name: fault-zeroing
      file_access:
        read:
          - "/mnt/skills/fault-zeroing"
          - "{{inputs.output_base_dir}}/fault_tree.json"
        write:
          - "{{inputs.output_base_dir}}/artifacts/corrective_actions.json"
      params:
        max_turns: 150
        system_prompt: |
          你是纠正措施分析师。基于根因归因生成纠正措施。
          纠正措施 ≠ 验证计划：纠正措施修复问题，验证计划确认问题。
        prompt: |
          读取 {{inputs.output_base_dir}}/fault_tree.json

          为每条 status=confirmed 的根因生成纠正措施。

          输出：写入 {{inputs.output_base_dir}}/artifacts/corrective_actions.json
          ```json
          {
            "corrective_actions": [
              {
                "id": "CA-001",
                "name": "更换燃油泵",
                "description": "对批次燃油泵更换",
                "target_root_cause_id": "RC-001",
                "owner": "工艺部门",
                "completion_criteria": "更换后通过48小时试车",
                "priority": "high",
                "status": "planned"
              }
            ]
          }
          ```

          失败契约：若无法完成任务，回复必须以 FAILED: 开头说明原因；
          严禁写入占位文件。
    schemas:
      - file: "{{inputs.output_base_dir}}/artifacts/corrective_actions.json"
        schema_file: "/mnt/skills/fault-zeroing/templates/corrective_actions.schema.json"
    preconditions:
      - file: "{{inputs.output_base_dir}}/fault_tree.json"
        non_empty: true
        json_path: "$.root_causes[*].status"
        some_equals: confirmed
    on_precondition_failure: skip
    writes:
      - "$.state.corrective_actions_summary"

  # ── 文档生产 ──
  - id: generate_outputs
    type: action
    action:
      kind: agent
      name: fault-zeroing
      file_access:
        read:
          - "/mnt/skills/fault-zeroing"
          - "/mnt/skills/fault-zeroing/templates"
          - "{{inputs.output_base_dir}}/fault_tree.json"
          - "{{inputs.output_base_dir}}/artifacts/evidence/evidence_table.json"
          - "{{inputs.output_base_dir}}/artifacts/evidence/coverage_matrix.md"
          - "{{inputs.output_base_dir}}/artifacts/corrective_actions.json"
        write:
          - "{{inputs.output_base_dir}}/fault_tree.svg"
          - "{{inputs.output_base_dir}}/bottom_event_assessment.md"
          - "{{inputs.output_base_dir}}/analysis_process.svg"
          - "{{inputs.output_base_dir}}/zeroing_report.md"
      params:
        max_turns: 200
        system_prompt: |
          你是文档工程师。基于所有分析产物生成标准输出文件。
          ⚠️ 不修改 fault_tree.json——它已是最终版。
        prompt: |
          读取以下产物：
          - {{inputs.output_base_dir}}/fault_tree.json
          - {{inputs.output_base_dir}}/artifacts/evidence/evidence_table.json
          - {{inputs.output_base_dir}}/artifacts/evidence/coverage_matrix.md
          - {{inputs.output_base_dir}}/artifacts/corrective_actions.json
          （若 corrective_actions.json 不存在，说明根因归因后没有 confirmed 根因，
          纠正措施被跳过；此时报告的"纠正措施"章节应写明"无已确认根因，
          不生成纠正措施"，其余输出照常生成。）

          生成以下 4 个文件到 {{inputs.output_base_dir}}/：

          1. fault_tree.svg
             静态 SVG：顶事件→中间事件→底事件，标注逻辑门和底事件状态
             不含 script/event handler/external URL

          2. bottom_event_assessment.md
              格式参考 /mnt/skills/fault-zeroing/templates/bottom_event_assessment.md

          3. analysis_process.svg
             静态 SVG：证据提取→故障树构建→底事件评估→根因归因→纠正措施→文档生产
             不含 script/event handler/external URL

          4. zeroing_report.md
             10 章节：
              1. 问题概述
              2. 输入资料（含覆盖矩阵）
              3. 故障现象
              4. 故障树分析
              5. 底事件概率评估
              6. 根因归因
              7. 验证计划与待验证项
              8. 纠正措施
              9. 遗留风险
              10. 证据引用（含分析过程追溯）
             资料覆盖矩阵必须使用模板的语义结构，至少包含表头“类别（或资料类别）”
             和“检查结果（或覆盖状态/覆盖情况）”，并列出五类资料、来源和缺失影响。
             报告中的验证计划必须逐项列出 fault_tree.json verification_plan 中的全部 ID
             （例如 VP-01）；每个验证项的 item 可以润色，但必须保留对应 ID 和完整语义。
             请参考 /mnt/skills/fault-zeroing/templates/zeroing_report.md 的表格结构。

          质量自检：
          - 4 个文件全部存在且非空
          - 报告包含资料覆盖矩阵、证据台账摘要、待验证项、遗留风险
          - fault_tree.json 的顶事件、根因、待验证项与报告一致
          - SVG 为纯静态
          - 分析过程追溯标记：证据提取、故障树构建、底事件评估、根因归因、纠正措施、文档生产

          失败契约：任一输入文件缺失或无法生成全部 4 个文件时，回复必须以
          FAILED: 开头说明缺失项；严禁生成占位/空文件。
    preconditions:
      - file: "{{inputs.output_base_dir}}/fault_tree.json"
        non_empty: true
      - file: "{{inputs.output_base_dir}}/artifacts/evidence/evidence_table.json"
        non_empty: true
    retry:
      max_attempts: 2
      backoff_seconds: 30

