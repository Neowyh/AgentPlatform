# iDeer 内网部署配置文件
#
# 使用说明：
# - 复制此文件为 `config.yaml` 并根据实际环境修改
# - 所有模型地址指向内网 vLLM/Ollama 服务，无需外网访问
# - 已移除所有需要外网的工具（网页搜索、网页抓取等）
# - 环境变量可用于所有字段值，示例：`api_key: $VLLM_API_KEY`

# ============================================================================
# 配置版本
# ============================================================================
config_version: 10

# ============================================================================
# 日志配置
# ============================================================================
log_level: info

# ============================================================================
# Token 用量统计
# ============================================================================
token_usage:
  enabled: true

# ============================================================================
# 模型配置（内网 vLLM / Ollama）
# ============================================================================
# 所有模型均指向内网推理服务，无需外网 API Key
# 请根据实际部署地址修改 base_url

models:
  # vLLM 部署示例（OpenAI 兼容接口）
  # 适用于内网 GPU 集群上通过 vLLM 部署的大模型
  - name: qwen3-32b
    display_name: Qwen3 32B (vLLM)
    use: ideer.models.vllm_provider:VllmChatModel
    model: Qwen/Qwen3-32B
    api_key: $VLLM_API_KEY
    base_url: http://vllm.internal.com:8000/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 8192
    supports_thinking: true
    supports_vision: false
    when_thinking_enabled:
      extra_body:
        chat_template_kwargs:
          enable_thinking: true

  # Ollama 部署示例（原生 Ollama API）
  # 适用于内网单机或小型集群上通过 Ollama 运行的模型
  # 注意：使用 langchain_ollama:ChatOllama 而非 OpenAI 兼容接口，
  # 以正确保留思考/推理内容
  # - name: qwen3-local
  #   display_name: Qwen3 32B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: qwen3:32b
  #   base_url: http://ollama.internal.com:11434
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true
  #   supports_thinking: true
  #   supports_vision: false

  # vLLM 部署视觉模型示例
  # - name: qwen2.5-vl-72b
  #   display_name: Qwen2.5 VL 72B (vLLM)
  #   use: ideer.models.vllm_provider:VllmChatModel
  #   model: Qwen/Qwen2.5-VL-72B-Instruct
  #   api_key: $VLLM_API_KEY
  #   base_url: http://vllm.internal.com:8000/v1
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 8192
  #   supports_thinking: false
  #   supports_vision: true

# ============================================================================
# 工具组配置
# ============================================================================
# 内网环境不使用网页搜索类工具，仅保留文件操作和命令行工具

tool_groups:
  - name: file:read
  - name: file:write
  - name: bash
  - name: document

# ============================================================================
# 工具配置
# ============================================================================
# 已移除所有需要外网访问的工具（ddg_search, serper, tavily, jina, firecrawl, infoquest）
# 仅保留本地文件操作和命令行执行工具

tools:
  # 文件操作工具
  - name: ls
    group: file:read
    use: ideer.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: ideer.sandbox.tools:read_file_tool

  - name: glob
    group: file:read
    use: ideer.sandbox.tools:glob_tool
    max_results: 200

  - name: grep
    group: file:read
    use: ideer.sandbox.tools:grep_tool
    max_results: 100

  - name: write_file
    group: file:write
    use: ideer.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: ideer.sandbox.tools:str_replace_tool

  # Bash 命令执行工具
  - name: bash
    group: bash
    use: ideer.sandbox.tools:bash_tool

  # 文档读取工具 — 将 PDF/Word/Excel/PowerPoint 转换为 Markdown 供智能体阅读
  # （软件任务书等办公文档解析依赖此工具）
  - name: read_document
    group: document
    use: ideer.community.doc_reader.tools:read_document_tool

# ============================================================================
# 工具搜索配置（延迟加载）
# ============================================================================
tool_search:
  enabled: false

# ============================================================================
# 循环检测配置
# ============================================================================
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50

# ============================================================================
# 安全终止配置
# ============================================================================
safety_finish_reason:
  enabled: true

# ============================================================================
# 上传限制
# ============================================================================
uploads:
  max_files: 10
  max_file_size: 52428800    # 50 MiB
  max_total_size: 104857600  # 100 MiB
  auto_convert_documents: false
  pdf_converter: auto

# ============================================================================
# 沙箱配置（内网 Docker 部署）
# ============================================================================
# 默认使用本地 provider，因此离线包不依赖额外 sandbox 镜像。
# 为避免在 gateway 容器中执行宿主机命令，bash 默认关闭；需要容器化
# sandbox 的部署可自行改为 AioSandboxProvider 并显式打包 --sandbox-image。
sandbox:
  use: ideer.sandbox.local:LocalSandboxProvider
  allow_host_bash: false

  # 工具输出截断限制（字符数）
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

  # OfficeCLI 单文件二进制只读挂载（离线 Word/Excel/PPT 生成）
  # host_path 指向仓库内 vendor/officecli/officecli（随代码库分发，内网可复现）
  mounts:
    - host_path: /opt/deer-flow/vendor/officecli/officecli
      container_path: /usr/local/bin/officecli
      read_only: true

  # 关闭 OfficeCLI 后台联网更新检查（离线必需）
  environment:
    OFFICECLI_SKIP_UPDATE: "1"

# ============================================================================
# 子代理配置
# ============================================================================
# subagents:
#   timeout_seconds: 900
#   agents:
#     general-purpose:
#       timeout_seconds: 1800
#       max_turns: 160
#     bash:
#       timeout_seconds: 300
#       max_turns: 80

# ============================================================================
# 技能配置
# ============================================================================
skills:
  container_path: /mnt/skills

# ============================================================================
# 标题生成配置
# ============================================================================
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null

# ============================================================================
# 对话摘要配置
# ============================================================================
summarization:
  enabled: true
  model_name: null
  trigger:
    - type: tokens
      value: 32000
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
    - read_file
    - read
    - view
    - cat

# ============================================================================
# 记忆配置
# ============================================================================
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000

# ============================================================================
# 自定义代理管理 API
# ============================================================================
agents_api:
  enabled: false

# ============================================================================
# 技能自进化配置
# ============================================================================
skill_evolution:
  enabled: false
  moderation_model_name: null

# ============================================================================
# 数据库配置
# ============================================================================
database:
  backend: sqlite
  sqlite_dir: .ideer/data

# ============================================================================
# 运行事件配置
# ============================================================================
run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true

# ============================================================================
# 链路追踪配置（内网默认关闭）
# ============================================================================
# 内网环境默认不启用外部追踪服务
# 如需启用，可配置为 Jaeger 等内网追踪服务
# tracing:
#   enabled: true
#   exporter: otlp
#   endpoint: http://jaeger.internal.com:4317

# ============================================================================
# 断路器配置
# ============================================================================
# circuit_breaker:
#   failure_threshold: 5
#   recovery_timeout_sec: 60
