name: Frontend Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: frontend-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run unit tests of frontend
        working-directory: frontend
        run: make test-coverage

      - name: Publish frontend coverage summary
        working-directory: frontend
        run: |
          COVERAGE_JSON="coverage/coverage-final.json"
          test -f "$COVERAGE_JSON" || exit 0
          STATEMENTS=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('$COVERAGE_JSON', 'utf8'));
            let total = 0, covered = 0;
            for (const file of Object.values(data)) {
              const s = file.s || {};
              for (const count of Object.values(s)) {
                total++;
                if (count > 0) covered++;
              }
            }
            console.log(((covered / total) * 100).toFixed(2));
          ")
          echo "Frontend statement coverage: ${STATEMENTS}%"
          echo "Frontend coverage is diagnostic only."
          {
            echo "## Frontend Coverage Report"
            echo "Frontend statement coverage: ${STATEMENTS}%"
            echo "Coverage is diagnostic only."
          } >> "$GITHUB_STEP_SUMMARY"
