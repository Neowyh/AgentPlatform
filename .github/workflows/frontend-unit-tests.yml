name: Frontend Unit Tests

on:
  push:
    branches: [develop, "product/offline-*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: frontend-unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-unit-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.26.2 --activate
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend standard tests
        env:
          NODE_VERSION: "22"
          PNPM_VERSION: "10.26.2"
        run: bash scripts/run-test-lane.sh frontend-standard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-evidence-${{ github.run_id }}
          path: logs/test-lanes/**
          if-no-files-found: ignore

  frontend-core:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.26.2 --activate
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend core with coverage
        env:
          NODE_VERSION: "22"
          PNPM_VERSION: "10.26.2"
        run: bash scripts/run-test-lane.sh frontend-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-core-evidence-${{ github.run_id }}
          path: |
            frontend/coverage/**
            logs/test-lanes/**
          if-no-files-found: ignore
