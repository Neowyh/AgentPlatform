name: Unit Tests

on:
  push:
    branches: [develop, "product/offline-*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: backend-unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.26.2 --activate
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Run backend standard shard ${{ matrix.shard }}/4
        env:
          TEST_LANE_SHARDS: "4"
          TEST_LANE_SHARD_INDEX: ${{ matrix.shard }}
          TEST_LANE_COVERAGE: "0"
          NODE_VERSION: "22"
          PNPM_VERSION: "10.26.2"
          UV_VERSION: "0.11.1"
        run: bash scripts/run-test-lane.sh backend-standard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence-${{ matrix.shard }}-${{ github.run_id }}
          path: logs/test-lanes/**
          if-no-files-found: ignore

  backend-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.26.2 --activate
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Run standard coverage shard ${{ matrix.shard }}/4
        env:
          COVERAGE_FILE: coverage-shard-${{ matrix.shard }}.dat
          TEST_LANE_COVERAGE: "1"
          TEST_LANE_SHARDS: "4"
          TEST_LANE_SHARD_INDEX: ${{ matrix.shard }}
        run: bash scripts/run-test-lane.sh backend-standard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-full-evidence-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            backend/coverage-shard-${{ matrix.shard }}.dat
            logs/test-lanes/**
          if-no-files-found: ignore

  backend-serial:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: backend-full
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.26.2 --activate
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Run all serial tests once, sequentially
        env:
          COVERAGE_FILE: coverage-serial.dat
          TEST_LANE_COVERAGE: "1"
          TEST_LANE_SHARDS: "0"
        run: bash scripts/run-test-lane.sh backend-serial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-full-evidence-serial-${{ github.run_id }}
          path: |
            backend/coverage-serial.dat
            logs/test-lanes/**
          if-no-files-found: ignore

  backend-coverage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [backend-full, backend-serial]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.26.2 --activate
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-full-evidence-*
          path: backend/.coverage-data
          merge-multiple: true
      - name: Combine diagnostic coverage
        working-directory: backend
        run: |
          uv run coverage combine .coverage-data
          uv run coverage report --show-missing
          echo "Coverage is diagnostic only."
