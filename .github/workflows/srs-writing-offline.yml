name: SRS Writing Offline E2E

on:
  push:
    branches: [ 'main' ]
    paths:
      - "skills/custom/srs-writing/**"
      - "scripts/smoke_srs_flow.py"
      - "scripts/validate_srs_outputs.py"
      - "vendor/officecli/**"
      - "docs/srs-writing-agent/**"
      - ".github/workflows/srs-writing-offline.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skills/custom/srs-writing/**"
      - "scripts/smoke_srs_flow.py"
      - "scripts/validate_srs_outputs.py"
      - "vendor/officecli/**"
      - "docs/srs-writing-agent/**"
      - ".github/workflows/srs-writing-offline.yml"
  workflow_dispatch:

concurrency:
  group: srs-writing-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run offline SRS smoke (generate + validate)
        run: |
          python3 scripts/smoke_srs_flow.py --outputs-dir /tmp/srs-smoke-outputs
          python3 scripts/validate_srs_outputs.py --outputs-dir /tmp/srs-smoke-outputs
