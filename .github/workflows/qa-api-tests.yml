name: QA API Tests

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'backend/**'
      - '.github/workflows/qa-api-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/**'
      - '.github/workflows/qa-api-tests.yml'

concurrency:
  group: qa-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa-api-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Prepare config
        run: cp config.example.yaml config.yaml

      - name: Start backend server
        working-directory: backend
        run: |
          PYTHONPATH=. PYTHONIOENCODING=utf-8 PYTHONUTF8=1 \
            nohup uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 &
          echo $! > /tmp/backend.pid

      - name: Wait for server ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/v1/auth/setup-status > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30s"
          exit 1

      - name: Run API QA tests
        working-directory: backend
        env:
          QA_BASE_URL: http://localhost:8001
        run: PYTHONPATH=. uv run pytest tests/qa/test_api_qa.py -v --tb=short

      - name: Run multi-role RBAC tests
        working-directory: backend
        env:
          QA_BASE_URL: http://localhost:8001
        run: PYTHONPATH=. uv run pytest tests/qa/test_api_qa_multitole.py -v --tb=short

      - name: Run SSE streaming tests
        working-directory: backend
        env:
          QA_BASE_URL: http://localhost:8001
        run: PYTHONPATH=. uv run pytest tests/qa/test_sse_streaming.py -v --tb=short

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) 2>/dev/null || true
          fi
