repos:
  # Backend: ruff lint + format via uv (uses the same ruff version as backend deps)
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: bash -c 'cd backend && uv run ruff check --fix "${@/#backend\//}"' --
        language: system
        types_or: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format "${@/#backend\//}"' --
        language: system
        types_or: [python]
        files: ^backend/

  # Frontend: eslint + prettier (must run from frontend/ for node_modules resolution)
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint --fix "${@/#frontend\//}"' --
        language: system
        require_serial: true
        types_or: [javascript, tsx, ts]
        files: ^frontend/

      - id: frontend-prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write "${@/#frontend\//}"' --
        language: system
        require_serial: true
        files: ^frontend/
        types_or: [javascript, tsx, ts, json, css]

  # Block local-only working files (dev-log/, coverage, tool caches) from ever entering
  - repo: local
    hooks:
      - id: block-untrackable-files
        name: block untrackable working files
        entry: bash -c 'blocked=$(git diff --cached --diff-filter=ACMR --name-only -z | xargs -0 -n1 echo | grep -E "^(dev-log/|task_plan\\.md$|progress\\.md$|findings\\.md$|coverage\\.json$|\\.coverage$|.*\\.qodo-cover\\.json$|backend/\\.test_durations$|pr-build/|\\.opencode/|\\.agents/|\\.mimocode/)"); if [ -n "$blocked" ]; then echo "Blocked files staged:"; echo "$blocked"; exit 1; fi'
        language: system
        stages: [pre-commit]
