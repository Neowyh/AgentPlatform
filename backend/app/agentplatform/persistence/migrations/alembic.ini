[alembic]
script_location = %(here)s
# Default URL for offline mode / autogenerate.
# Runtime is overridden by env.py from config.yaml database.backend/sqlite_dir
# (resolved against backend/ so migrations and Gateway share
# backend/.ideer/data/ideer.db). Keep this portable -- never commit an
# absolute /home/... path here. Relative form resolves against the CWD,
# so run alembic from backend/ (see scripts/serve.sh).
sqlalchemy.url = sqlite+aiosqlite:///.ideer/data/ideer.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
