[project]
name = "agentplatform-extension"
version = "0.1.0"
description = "AgentPlatform enterprise boundary for DeerFlow runtime"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentplatform_extension"]
