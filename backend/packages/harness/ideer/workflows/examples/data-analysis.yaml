# data-analysis.yaml
# 多步骤串联示例：tool step -> agent step -> human_review step。
# 用途：展示步骤间变量传递 {{steps.xxx.output}}、retry 配置、人工审核。

name: data-analysis
description: 数据分析工作流 — 获取数据、自动分析、人工审核后出报告
version: "1.0"

inputs:
  data_source:
    type: string
    required: true
    description: "数据来源（数据库名、文件路径或 API 地址）"
  analysis_type:
    type: string
    default: "summary"
    description: "分析类型：summary / trend / anomaly"

steps:
  # 步骤 1: 通过 tool 获取原始数据
  - id: fetch_data
    type: tool
    tool: sql_query
    params:
      source: "{{inputs.data_source}}"
      limit: 10000
    timeout: 120

  # 步骤 2: agent 分析上一步获取的数据
  - id: analyze
    type: agent
    agent: data-analyst
    prompt: |
      请对以下数据进行 {{inputs.analysis_type}} 分析：

      {{steps.fetch_data.output}}

      要求：
      1. 给出概要统计
      2. 识别关键趋势或异常
      3. 提供可执行建议
    retry:
      max: 2
      backoff: 5

  # 步骤 3: 人工审核分析结果
  - id: review
    type: human_review
    message: "请审核数据分析结果，确认是否可以输出为最终报告"
    approvers:
      - data-team-lead

  # 步骤 4: 审核通过后生成报告（通过 condition 控制）
  - id: generate_report
    type: agent
    agent: report-writer
    condition: "{{steps.review.approved}}"
    prompt: |
      根据以下分析结果生成最终报告：

      {{steps.analyze.output}}

      审核意见: {{steps.review.data}}
