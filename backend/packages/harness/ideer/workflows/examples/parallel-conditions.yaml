# parallel-conditions.yaml
# 复杂组合示例：condition 分支 + parallel 并发 + loop 遍历。
# 用途：展示嵌套 step 定义、条件分支、并行执行和循环结构。

name: parallel-conditions
description: 复杂组合工作流 — 条件分支、并行执行、循环遍历
version: "1.0"

inputs:
  query:
    type: string
    required: true
    description: "用户查询内容"
  mode:
    type: string
    default: "standard"
    description: "执行模式：standard / deep"

steps:
  # 步骤 1: 根据 mode 进行条件分支
  - id: route_by_mode
    type: condition
    expression: "{{inputs.mode}} == 'deep'"
    then:
      id: deep_research
      type: agent
      agent: deep-researcher
      prompt: |
        对以下查询进行深度研究：

        {{inputs.query}}

        要求：全面调研，提供详细分析和引用来源。
      timeout: 300
    else:
      id: quick_search
      type: tool
      tool: web_search
      params:
        query: "{{inputs.query}}"
        max_results: 5

  # 步骤 2: 并行执行多个子任务
  - id: parallel_analysis
    type: parallel
    steps:
      - id: sentiment_analysis
        type: agent
        agent: sentiment-analyst
        prompt: |
          分析以下查询的情感倾向：

          {{inputs.query}}

          输出：正面/中性/负面 + 置信度 + 理由。

      - id: keyword_extraction
        type: agent
        agent: keyword-extractor
        prompt: |
          从以下查询中提取关键词和实体：

          {{inputs.query}}

          输出：关键词列表 + 实体分类（人名/地名/组织/其他）。

      - id: language_check
        type: tool
        tool: language_detector
        params:
          text: "{{inputs.query}}"

  # 步骤 3: 遍历关键词列表，逐个生成摘要
  - id: summarize_each
    type: loop
    items: "{{steps.parallel_analysis.steps.keyword_extraction.output.keywords}}"
    steps:
      - id: summarize_keyword
        type: agent
        agent: summarizer
        prompt: |
          请对以下关键词进行一句话解释：

          关键词: {{item}}

          保持简洁准确。

  # 步骤 4: 汇总所有结果
  - id: final_summary
    type: agent
    agent: report-writer
    prompt: |
      请汇总以下分析结果，生成最终报告：

      研究结果: {{steps.route_by_mode.output}}
      情感分析: {{steps.parallel_analysis.steps.sentiment_analysis.output}}
      关键词: {{steps.parallel_analysis.steps.keyword_extraction.output}}
      语言检测: {{steps.parallel_analysis.steps.language_check.output}}
      关键词摘要: {{steps.summarize_each.output}}
    retry:
      max: 2
      backoff: 10
      on_errors:
        - "TimeoutError"
        - "RateLimitError"
