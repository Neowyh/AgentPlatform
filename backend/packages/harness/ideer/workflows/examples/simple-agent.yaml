# simple-agent.yaml
# 最简单的 workflow 示例：1 个输入 + 1 个 agent step，展示变量引用。
# 用途：快速了解 workflow YAML 的最小结构。

name: simple-agent
description: 最简单的 agent 工作流 — 单输入、单步骤、变量传递
version: "1.0"

inputs:
  topic:
    type: string
    required: true
    description: "要研究的主题"

steps:
  - id: research
    type: agent
    agent: researcher
    prompt: |
      请对以下主题进行简要研究并给出总结：

      主题: {{inputs.topic}}

      要求：
      1. 概述主题背景
      2. 列出 3 个关键要点
      3. 给出一句话总结
