[alembic]
script_location = %(here)s
# The unified chain also tracks the AgentPlatform control-plane revisions
# (resource/departments/workflow governance tables), which stay in their own
# versions directory. This is the single ``alembic upgrade head`` entry point:
# one head, one ``alembic_version`` table, both table families.
path_separator = space
version_locations = %(here)s/versions %(here)s/../../../../../app/agentplatform/persistence/migrations/versions
# Default URL for offline mode / autogenerate.
# Runtime uses engine from DeerFlow config.
sqlalchemy.url = sqlite+aiosqlite:///./data/deerflow.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
